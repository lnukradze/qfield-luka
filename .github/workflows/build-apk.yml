name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: opengisch/qfield-sdk:20210413

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Build APK
        env:
          APK_VERSION_CODE: "10906000"
          APP_VERSION_STR: "v1.9.6-LukaNukradze"
          APP_VERSION: "v1.9.6"
          ARCH: arm64_v8a
          BUILD_FOLDER: build-arm64
        run: |
          chmod +x scripts/docker-build.sh
          bash scripts/docker-build.sh

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: QField-LukaNukradze-arm64.apk
          path: build-arm64/android-build/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload APK (armv7 fallback path)
        uses: actions/upload-artifact@v3
        if: failure()
        with:
          name: build-logs
          path: build-arm64/
